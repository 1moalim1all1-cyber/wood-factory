<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">مصنع الأخشاب المتكامل</a><a class="btn" href="quote.html">اطلب عرض سعر</a></div></header><main class="wrap" id="app"><div class="panel" style="margin:70px 0">جاري تحميل المنتج...</div></main><script type="module">import{product,getSettings}from'./firebase.js';const id=new URLSearchParams(location.search).get('id'),p=await product(id),s=await getSettings(),app=document.getElementById('app'),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!p)app.innerHTML='<div class="panel" style="margin:70px 0">المنتج غير موجود.</div>';else{document.title=p.name;const wa=(s.whatsapp||'').replace(/\D/g,'');app.innerHTML=`<section class="detail">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="panel"></div>'}<div class="panel"><div class="gold">منتج حسب الطلب</div><h1 style="font-size:42px">${esc(p.name)}</h1><p class="lead">${esc(p.description)}</p><p><b class="gold">الخامة:</b> ${esc(p.material)}</p><p><b class="gold">السعر:</b> ${esc(p.price)}</p><div class="actions"><a class="btn" href="quote.html?product=${encodeURIComponent(p.id)}">اطلب عرض سعر</a>${wa?`<a class="btn ghost" target="_blank" href="https://wa.me/${wa}?text=${encodeURIComponent('أريد عرض سعر للمنتج: '+p.name)}">واتساب</a>`:''}</div></div></section>`}}</script></body></html>
