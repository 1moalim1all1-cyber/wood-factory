<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم المصنع</title><link rel="stylesheet" href="styles.css"></head><body><section id="login" class="login"><div class="panel loginbox"><h1>دخول الإدارة</h1><p class="lead">الدخول برقم الموبايل وكود SMS من Firebase.</p><div id="recaptcha-container"></div><form id="phoneForm" class="form"><input class="field full" id="phone" placeholder="01012345678" required><button class="btn full">إرسال كود التحقق</button></form><form id="otpForm" class="form hidden" style="margin-top:14px"><input class="field full" id="otp" placeholder="كود SMS" required><button class="btn full">تأكيد الكود</button></form><div id="loginMsg" class="notice hidden"></div></div></section><section id="app" class="admin hidden"><aside class="side"><h2>لوحة التحكم</h2><button data-view="products">المنتجات</button><button data-view="add">إضافة منتج</button><button data-view="leads">طلبات العملاء</button><button data-view="settings">إعدادات الموقع</button><button data-view="seed">تهيئة منتجات تجريبية</button><button id="logout">تسجيل خروج</button></aside><main class="mainadmin"><div id="adminNotice" class="notice hidden"></div><section id="view-products"><h1>المنتجات</h1><div id="productsTable"></div></section><section id="view-add" class="hidden"><h1 id="formTitle">إضافة منتج</h1><form id="productForm" class="form panel"><input type="hidden" id="pid"><input class="field" id="pname" required placeholder="اسم المنتج"><select class="field" id="pcat"><option value="kitchens">مطابخ</option><option value="doors">أبواب</option><option value="bedrooms">غرف نوم</option><option value="dressing">دريسنج</option><option value="office">أثاث مكتبي</option><option value="decor">ديكورات</option><option value="custom">تصنيع خاص</option></select><input class="field" id="pmaterial" placeholder="الخامة"><input class="field" id="pprice" placeholder="السعر / يبدأ من"><input class="field full" type="file" id="pimage" accept="image/*"><input class="field full" id="pimageurl" placeholder="أو رابط صورة"><textarea class="field full" id="pdesc" rows="5" placeholder="الوصف"></textarea><input class="field" id="porder" type="number" value="1" placeholder="الترتيب"><label class="field"><input id="pactive" type="checkbox" checked> ظاهر بالموقع</label><button class="btn full">حفظ المنتج</button></form></section><section id="view-leads" class="hidden"><h1>طلبات العملاء</h1><div id="leadsTable"></div></section><section id="view-settings" class="hidden"><h1>إعدادات الموقع</h1><form id="settingsForm" class="form panel"><input class="field" id="factoryName" placeholder="اسم المصنع"><input class="field" id="phoneSet" placeholder="الهاتف"><input class="field" id="whatsapp" placeholder="واتساب بصيغة 2010..."><input class="field" id="email" placeholder="الإيميل"><input class="field full" id="address" placeholder="العنوان"><button class="btn full">حفظ الإعدادات</button></form></section><section id="view-seed" class="hidden"><h1>تهيئة سريعة</h1><div class="panel"><p>يضيف 7 منتجات تجريبية، منتج لكل قسم. استخدمها مرة واحدة فقط.</p><button class="btn" id="seedBtn">إضافة المنتجات التجريبية</button></div></section></main></section><script type="module" src="admin.js"></script></body></html>
