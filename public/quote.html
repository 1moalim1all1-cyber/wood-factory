<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب عرض سعر</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="wrap"><a class="brand" data-factory href="index.html">مصنع الأخشاب المتكامل</a><a class="btn ghost" href="index.html">الرئيسية</a></div></header><main class="wrap"><section class="pagehero"><h1>اطلب عرض سعر</h1><p class="lead">أرسل تفاصيل مشروعك، وسيظهر الطلب فورًا في لوحة التحكم.</p></section><section class="panel" style="margin-bottom:70px"><form class="form" id="lead"><input class="field" name="الاسم" required placeholder="الاسم"><input class="field" name="الهاتف" required placeholder="رقم الهاتف / واتساب"><select class="field" name="القسم"><option>مطابخ</option><option>أبواب</option><option>غرف نوم</option><option>دريسنج</option><option>أثاث مكتبي</option><option>ديكورات</option><option>تصنيع خاص</option></select><input class="field" name="المقاسات" placeholder="المقاسات التقريبية"><input class="field full" name="المدينة" placeholder="المدينة / مكان التنفيذ"><textarea class="field full" name="التفاصيل" rows="6" placeholder="تفاصيل المشروع والخامة المطلوبة"></textarea><button class="btn full">إرسال الطلب</button></form></section></main><script type="module">import{bindLeadForm}from'./site.js';bindLeadForm(document.getElementById('lead'))</script></body></html>
